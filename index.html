<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    
    header { background: #1e293b; padding: 14px 16px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 1.1rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; }
    
    .config-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .config-group input, .config-group select { padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.85rem; outline: none; }
    .config-group input { flex: 1; min-width: 200px; }
    .config-group select { min-width: 150px; }
    .config-group input:focus, .config-group select:focus { border-color: #38bdf8; }

    #chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
    .user-msg { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot-msg { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    .bot-msg pre { background: #0f172a; padding: 10px; border-radius: 6px; overflow-x: auto; margin-top: 8px; border: 1px solid #334155; font-family: monospace; }
    .sys-msg { text-align: center; font-size: 0.8rem; color: #64748b; margin: 4px 0; }

    footer { padding: 12px 16px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
    textarea { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; resize: none; font-size: 0.95rem; outline: none; height: 44px; max-height: 120px; }
    textarea:focus { border-color: #38bdf8; }
    button { background: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="title"><span class="status-dot"></span> Local ESP32 AI Assistant</div>
    </div>
    <div class="config-group">
      <!-- URL ท่อ Ngrok ที่แมปไว้ให้อัตโนมัติ -->
      <input type="text" id="tunnel-url" value="https://unburned-affected-ninth.ngrok-free.dev " placeholder="https://xxx.ngrok-free.dev">
      <select id="model-select">
        <option value="qwen2.5-coder:3b">Qwen 2.5 Coder 3B</option>
        <option value="qwen2.5:3b">Qwen 2.5 3B</option>
        <option value="qwen2.5:1.5b">Qwen 2.5 1.5B</option>
      </select>
    </div>
  </header>

  <div id="chat-box">
    <div class="sys-msg">เชื่อมต่อกับ Ollama ผ่าน Ngrok พร้อมใช้งานแล้วครับ</div>
  </div>

  <footer>
    <textarea id="user-input" placeholder="สั่งงาน AI หรือให้ช่วยเขียนโค้ด ESP32 ที่นี่..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">ส่ง</button>
  </footer>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const tunnelUrlInput = document.getElementById('tunnel-url');
    const modelSelect = document.getElementById('model-select');

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      let baseUrl = tunnelUrlInput.value.trim();

      if (!text) return;
      if (!baseUrl) {
        alert('กรุณากรอก Ngrok URL');
        return;
      }

      if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

      appendMessage(text, 'user-msg');
      userInput.value = '';
      sendBtn.disabled = true;

      const botMsgDiv = appendMessage('กำลังประมวลผล...', 'bot-msg');

      try {
        const response = await fetch(`${baseUrl}/api/generate`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({
            model: modelSelect.value,
            prompt: text,
            stream: false
          })
        });

        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        const data = await response.json();
        
        // แปลงข้อความบล็อกโค้ดแบบง่าย
        let formattedResponse = data.response.trim();
        formattedResponse = formattedResponse.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        
        botMsgDiv.innerHTML = formattedResponse;
      } catch (err) {
        botMsgDiv.innerText = `❌ ข้อผิดพลาด: ${err.message}\n(โปรดตรวจสอบว่าได้รัน ngrok http 11434 --host-header="localhost:11434" แล้วหรือยัง)`;
        botMsgDiv.style.color = '#ef4444';
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, className) {
      const msg = document.createElement('div');
      msg.className = `msg ${className}`;
      msg.innerText = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }
  </script>

</body>
</html>
